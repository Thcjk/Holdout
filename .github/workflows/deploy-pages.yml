name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Basispfad bestimmen
        id: base
        # Aus dem Repo-Namen abgeleitet statt fest eingetragen: Beim Umbenennen
        # des Repositorys aendert sich die Pages-Adresse mit, und ein fest
        # verdrahteter Pfad laesst danach jede Spieldatei ins Leere zeigen -
        # die Seite laedt dann nur noch den Hintergrund.
        run: echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          # Eigener TURN-Schluessel (metered.ca). Fehlt das Secret, ist der Wert
          # leer - dann gelten die oeffentlichen Open-Relay-Daten aus
          # src/net/peerConfig.ts und das Spiel laeuft normal weiter.
          #
          # Anzulegen unter Settings -> Secrets and variables -> Actions als
          # TURN_API_KEY. Zur Erinnerung: Dieser Wert wird beim Bauen fest in
          # das ausgelieferte JavaScript eingesetzt und ist dort lesbar - ein
          # Secret schuetzt ihn nur davor, im Repository zu stehen.
          VITE_TURN_API_KEY: ${{ secrets.TURN_API_KEY }}
          VITE_TURN_APP: ${{ vars.TURN_APP || 'holdout-turn' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
