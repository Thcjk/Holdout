name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Basispfad bestimmen
        id: base
        # Aus dem Repo-Namen abgeleitet statt fest eingetragen: Beim Umbenennen
        # des Repositorys aendert sich die Pages-Adresse mit, und ein fest
        # verdrahteter Pfad laesst danach jede Spieldatei ins Leere zeigen -
        # die Seite laedt dann nur noch den Hintergrund.
        run: echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
