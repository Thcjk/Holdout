name: Android APK

# Baut eine installierbare Android-App.
#
# Warum auf GitHub und nicht lokal? Auf den Runnern ist das Android-SDK bereits
# installiert. Wer die APK lokal bauen will, braucht Android Studio - nötig ist
# das aber nicht.
#
# Auslöser:
#   - ein Tag wie v1.0.0  -> baut und hängt die APK an ein Release
#   - "Run workflow"      -> baut eine APK als Artefakt; wird dabei ein Tag
#     eingetragen, legt der Workflow das Release selbst an (samt Tag)
#
# Der zweite Weg ist der bequemere: Er braucht keinen Git-Tag von Hand, und
# GitHub setzt den Tag beim Anlegen des Releases auf den gebauten Stand.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag für ein Release, z. B. v1.0.0 - leer lassen für einen reinen Testbau"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Spiel bauen
        # Basispfad "/" - in der App liegen die Dateien im Wurzelverzeichnis
        # der WebView, nicht unter /thistle-and-crown/ wie auf GitHub Pages.
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: In das Android-Projekt kopieren
        run: npx cap sync android

      - name: Signaturschlüssel bereitstellen
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Schlüssel hinterlegt - es wird ein Debug-Build gebaut."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen (signiert)
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK bauen (Debug)
        if: steps.keystore.outputs.available != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK einsammeln
        id: apk
        run: |
          path="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$path" ]; then
            echo "Keine APK gefunden." >&2
            exit 1
          fi
          cp "$path" koop-arena-shooter.apk
          echo "path=koop-arena-shooter.apk" >> "$GITHUB_OUTPUT"
          ls -lh koop-arena-shooter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koop-arena-shooter-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail

          notes=$(cat <<'TEXT'
          Android-App zum Herunterladen.

          **Installieren:** Die Datei `koop-arena-shooter.apk` auf dem Handy öffnen.
          Android fragt einmalig nach der Erlaubnis, Apps aus dieser Quelle zu
          installieren - bestätigen, fertig.

          **iPhone:** Für iOS gibt es keine App-Datei. Dort die Website öffnen und
          über „Teilen → Zum Home-Bildschirm" installieren.
          TEXT
          )

          # Gibt es das Release schon, wird die Datei nur ersetzt. Sonst wird es
          # angelegt - dabei setzt GitHub den Tag gleich mit auf diesen Stand.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Koop-Arena-Shooter $TAG" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY" \
              "$APK"
          fi
