name: Android APK

# Baut eine installierbare Android-App.
#
# Warum auf GitHub und nicht lokal? Auf den Runnern ist das Android-SDK bereits
# installiert. Wer die APK lokal bauen will, braucht Android Studio - nötig ist
# das aber nicht.
#
# Auslöser:
#   - ein Tag wie v1.0.0  -> baut und hängt die APK an ein Release
#   - "Run workflow"      -> baut und legt die APK als Artefakt ab

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Spiel bauen
        # Basispfad "/" - in der App liegen die Dateien im Wurzelverzeichnis
        # der WebView, nicht unter /thistle-and-crown/ wie auf GitHub Pages.
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: In das Android-Projekt kopieren
        run: npx cap sync android

      - name: Signaturschlüssel bereitstellen
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Schlüssel hinterlegt - es wird ein Debug-Build gebaut."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen (signiert)
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK bauen (Debug)
        if: steps.keystore.outputs.available != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK einsammeln
        id: apk
        run: |
          path="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$path" ]; then
            echo "Keine APK gefunden." >&2
            exit 1
          fi
          cp "$path" koop-arena-shooter.apk
          echo "path=koop-arena-shooter.apk" >> "$GITHUB_OUTPUT"
          ls -lh koop-arena-shooter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koop-arena-shooter-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Koop-Arena-Shooter ${GITHUB_REF_NAME}" \
            --notes "Android-App zum Herunterladen. Zum Installieren muss auf dem Handy einmalig „Installation aus unbekannten Quellen“ für den Browser erlaubt werden." \
            --repo "${GITHUB_REPOSITORY}" \
            "${{ steps.apk.outputs.path }}" \
          || gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --clobber --repo "${GITHUB_REPOSITORY}"
