<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Koop-Arena-Shooter – Top-down-Survival im Browser." />
    <meta name="theme-color" content="#11161f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Koop-Arena-Shooter</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #11161f;
        font-family: system-ui, sans-serif;
      }

      /* Verhindert, dass ein Wisch ueber den Bildschirm die Seite scrollt
         oder auf iOS das "Pull to refresh" ausloest. */
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #game-root canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
