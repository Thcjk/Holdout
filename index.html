<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Holdout – Top-down-Koop-Survival fürs Handy." />
    <meta name="theme-color" content="#11161f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Holdout</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #11161f;
        font-family: system-ui, sans-serif;
      }

      /* Verhindert, dass ein Wisch ueber den Bildschirm die Seite scrollt
         oder auf iOS das "Pull to refresh" ausloest. */
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #game-root canvas {
        display: block;
      }

      /* Querformat erzwingen, ohne den Spieler darum zu bitten.

         Das Spiel ist für Querformat gebaut. Hält jemand das Handy hochkant -
         oder hat die Rotationssperre an, was auf dem iPhone der Normalfall ist -
         wird die Zeichenfläche um 90 Grad gedreht. Die Klasse setzt
         src/platform/orientation.ts; dort wird auch die Umrechnung der
         Berührungen mitgedreht, denn CSS dreht nur das Bild, nicht die Finger.

         Wichtig: Gedreht wird NUR die Zeichenfläche, nicht ihr Rahmen. Phaser
         misst den Rahmen, um die Zeichenfläche einzupassen - und ein gedrehtes
         Element meldet die Masse, die es auf dem Bildschirm einnimmt, also
         wieder die hochkante. Der Rahmen bleibt deshalb ungedreht und bekommt
         nur die vertauschten Masse. */
      html.rotate-to-landscape #game-root {
        position: fixed;
        top: 0;
        left: 0;
        /* vh/vw als Rückfall für iOS vor 16.4, das dvh/dvw noch nicht kennt. */
        width: 100vh;
        width: 100dvh;
        height: 100vw;
        height: 100dvw;
        display: block;
      }

      /* Die Drehung selbst: an der linken oberen Ecke um 90 Grad, dann um die
         Bildschirmbreite nach rechts. Danach liegt die Zeichenfläche genau auf
         dem hochkanten Bildschirm - und aus einem Punkt (x, y) darauf wird
         (Bildschirmbreite - y, x), was orientation.ts wieder zurückrechnet. */
      html.rotate-to-landscape #game-root > canvas {
        position: absolute;
        top: 0;
        left: 0;
        /* Phaser zentriert die Zeichenfläche über Ränder, die es direkt ins
           style-Attribut schreibt. Die würden den Drehpunkt verschieben und
           die Umrechnung der Berührungen verfälschen - deshalb hier hart auf
           null, damit die Ecke oben links wirklich bei (0, 0) liegt. */
        margin: 0 !important;
        transform-origin: top left;
        transform: translateX(100vw) rotate(90deg);
        transform: translateX(100dvw) rotate(90deg);
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
