<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Holdout – Top-down-Koop-Survival fürs Handy." />
    <meta name="theme-color" content="#11161f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Holdout</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #11161f;
        font-family: system-ui, sans-serif;
      }

      /* Verhindert, dass ein Wisch ueber den Bildschirm die Seite scrollt
         oder auf iOS das "Pull to refresh" ausloest. */
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #game-root canvas {
        display: block;
      }

      /* Startbildschirm: "Bitte quer halten".

         Er steht bewusst direkt im HTML und nicht im Spielcode. Damit ist er
         sofort da - noch bevor Phaser geladen ist. Waere er Teil des Spiels,
         saehe man beim Start erst eine leere Flaeche und dann den Hinweis.

         WARUM ES IHN GIBT: Das Spiel misst beim Start den Bildschirm, um seine
         Flaeche darauf zuzuschneiden. Startet es hochkant und wird danach
         gedreht, war die Messung fuer das falsche Format - und es blieben
         Balken links und rechts. Der Startbildschirm haelt das Spiel auf, bis
         das Handy quer ist. Dann stimmt die Messung beim ersten Mal. */
      #rotate-gate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        background: #11161f;
        color: #dce8f7;
        text-align: center;
      }

      /* Ist das Spiel einmal gelaufen, blendet JavaScript ihn aus. */
      #rotate-gate[hidden] {
        display: none;
      }

      #rotate-gate .gate-title {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      #rotate-gate .gate-text {
        font-size: 15px;
        color: #8ea6c4;
        max-width: 420px;
        line-height: 1.5;
      }

      /* Ein Handy, das sich einmal dreht und dann liegen bleibt. */
      #rotate-gate .gate-phone {
        width: 54px;
        height: 92px;
        border: 3px solid #4aa3ff;
        border-radius: 10px;
        animation: gate-turn 2.4s ease-in-out infinite;
      }

      @keyframes gate-turn {
        0%,
        30% {
          transform: rotate(0deg);
        }
        55%,
        85% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      /* Notausgang fuer alle mit aktiver Rotationssperre: Dann meldet das
         Handy nie "quer", und ohne diesen Knopf kaeme man nie ins Spiel.
         Er erscheint erst nach ein paar Sekunden - wer einfach dreht, sieht
         ihn gar nicht. */
      #rotate-gate .gate-anyway {
        display: none;
        margin-top: 4px;
        padding: 10px 18px;
        border: 1px solid rgba(220, 232, 247, 0.35);
        border-radius: 8px;
        background: rgba(30, 39, 52, 0.9);
        color: #dce8f7;
        font: inherit;
        font-size: 14px;
      }

      /* Bewegung reduzieren, wenn das Geraet danach fragt. */
      @media (prefers-reduced-motion: reduce) {
        #rotate-gate .gate-phone {
          animation: none;
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="rotate-gate">
      <div class="gate-title">Holdout</div>
      <div class="gate-phone"></div>
      <div class="gate-text">
        Bitte das Handy quer halten.<br />Das Spiel startet dann von selbst.
      </div>
      <button type="button" class="gate-anyway">Trotzdem starten</button>
    </div>
    <script>
      /* Wächter für den Fall, dass die Spieldateien gar nicht erst ankommen.

         Genau das ist passiert, als das Repository umbenannt wurde: Die Seite
         lud, aber jede Datei zeigte auf die alte Adresse. Ergebnis war ein
         leeres, blaues Bild - ohne jeden Hinweis, weil noch kein Skript lief,
         das einen hätte geben können.

         Deshalb steht dieser Wächter direkt im HTML, in einfachem JavaScript
         ohne Module: Er läuft auch dann, wenn alles andere fehlschlägt. */
      (function () {
        var TIMEOUT_MS = 8000;

        window.__holdoutBooted = false;

        setTimeout(function () {
          if (window.__holdoutBooted) return;
          if (document.querySelector("#game-root canvas")) return;
          if (document.querySelector("[data-holdout-message]")) return;

          var page = document.createElement("div");
          page.setAttribute("data-holdout-message", "");
          page.style.cssText =
            "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;" +
            "align-items:center;justify-content:center;gap:16px;padding:24px;" +
            "box-sizing:border-box;background:#11161f;color:#dce8f7;text-align:center;" +
            "font-family:system-ui,sans-serif";

          var title = document.createElement("div");
          title.textContent = "Die Spieldateien konnten nicht geladen werden.";
          title.style.cssText = "font-size:18px;font-weight:700;color:#ff5470;max-width:520px";
          page.appendChild(title);

          var hint = document.createElement("div");
          hint.textContent =
            "Meistens hilft der Knopf unten. Bleibt es dabei, ist die Adresse " +
            "dieser Seite falsch - dann liegt es am Spiel, nicht an dir.";
          hint.style.cssText = "font-size:14px;color:#8ea6c4;max-width:520px;line-height:1.5";
          page.appendChild(hint);

          var where = document.createElement("div");
          where.textContent = location.href;
          where.style.cssText = "font-size:12px;color:#8ea6c4;word-break:break-all;max-width:520px";
          page.appendChild(where);

          var button = document.createElement("button");
          button.textContent = "Zwischenspeicher leeren und neu laden";
          button.style.cssText =
            "padding:12px 20px;border:none;border-radius:10px;background:#4cc2ff;" +
            "color:#11161f;font:600 15px system-ui,sans-serif";
          button.onclick = function () {
            var done = function () {
              location.reload();
            };
            try {
              navigator.serviceWorker
                .getRegistrations()
                .then(function (list) {
                  return Promise.all(
                    list.map(function (r) {
                      return r.unregister();
                    }),
                  );
                })
                .then(function () {
                  return caches.keys();
                })
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k);
                    }),
                  );
                })
                .then(done, done);
            } catch (e) {
              done();
            }
          };
          page.appendChild(button);

          document.body.appendChild(page);
        }, TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
